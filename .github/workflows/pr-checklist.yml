name: PR Checklist Validation

on:
  pull_request:
    types: [opened, edited, synchronize]

jobs:
  validate-checklist:
    runs-on: ubuntu-latest

    steps:
      - name: Check PR checklist
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || '';

            const unchecked = body.match(/- \[ \]/g);

            if (unchecked && unchecked.length > 0) {
              core.setFailed(
                `There are ${unchecked.length} unchecked checklist items in the PR description.`
              );
            }

      - name: Validate PR Title Format
        shell: bash
        run: |
          set -euo pipefail

          TITLE="${{ github.event.pull_request.title }}"
          BRANCH="${{ github.head_ref }}"

          echo "PR Branch: $BRANCH"
          echo "PR Title: $TITLE"

          BRANCH_LOWER="${BRANCH,,}"

          if [[ "$BRANCH_LOWER" =~ hotfix ]]; then
            echo "✅ Hotfix branch detected. Skipping PR title validation."
            exit 0
          fi

          REGEX='^.+ - Release Card ID: R[0-9]+$'

          if [[ ! "$TITLE" =~ $REGEX ]]; then
            echo "::error::PR title must follow the format: '<description> - Release Card ID: R<number>'"
            echo "::error::Example: Fix login issue - Release Card ID: R12345"
            exit 1
          fi

          echo "✅ PR title validation passed"